name: Deploy Render Test Environment

# Deploys the shared "goonbash-test" Render services (a Web Service running
# the backend, and a Static Site serving the frontend build) whenever there
# is new code to test: on every pull request push, and on every push to
# main. Whichever deploy is triggered most recently is the one that ends up
# live (see the concurrency block below), so the shared test environment
# always reflects the latest pushed commit.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

concurrency:
  group: render-test-deploy
  cancel-in-progress: true

env:
  RENDER_TEST_URL: https://goonbash-test.onrender.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract commit metadata
        id: pr_metadata
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "branch_name=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
            COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          else
            echo "pr_number=" >> $GITHUB_OUTPUT
            echo "branch_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            COMMIT_SHA="${{ github.sha }}"
          fi
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "commit_short_sha=${COMMIT_SHA:0:7}" >> $GITHUB_OUTPUT
          echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Update Render environment variables
        id: render_env
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_BACKEND_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
          COMMIT_SHA: ${{ steps.pr_metadata.outputs.commit_sha }}
          COMMIT_SHORT_SHA: ${{ steps.pr_metadata.outputs.commit_short_sha }}
          SOURCE_BRANCH: ${{ steps.pr_metadata.outputs.branch_name }}
          DEPLOYED_AT: ${{ steps.pr_metadata.outputs.deployed_at }}
        run: |
          # Upsert the commit metadata env vars individually so we don't
          # clobber any other env vars already configured on the service.
          # Only the backend service exposes the /deployment-info endpoint
          # that the frontend badge reads, so these are only set there.
          set -e
          for KEY in COMMIT_SHA COMMIT_SHORT_SHA SOURCE_BRANCH DEPLOYED_AT; do
            VALUE="${!KEY}"
            HTTP_STATUS=$(curl -s -o /tmp/render_env_response.json -w "%{http_code}" \
              -X PUT \
              "https://api.render.com/v1/services/${RENDER_BACKEND_SERVICE_ID}/env-vars/${KEY}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"value\": \"${VALUE}\"}")

            if [ "$HTTP_STATUS" -ge 300 ]; then
              echo "⚠️ Failed to set env var $KEY (HTTP $HTTP_STATUS):"
              cat /tmp/render_env_response.json
              echo "Continuing - deployment will proceed without updated $KEY"
            fi
          done

      - name: Deploy to Render
        id: render_deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_BACKEND_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
          RENDER_FRONTEND_SERVICE_ID: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
          COMMIT_SHA: ${{ steps.pr_metadata.outputs.commit_sha }}
        run: |
          # Trigger a deploy for one Render service and poll until it goes
          # live, fails, or times out (max 10 minutes). Prints progress and
          # returns non-zero on any failure.
          #
          # Render's deploy-trigger endpoint defaults to deploying the
          # latest commit on the service's connected branch (e.g. main) if
          # no commitId is given - it does NOT deploy whatever happens to
          # be checked out in this job. We explicitly pass the PR/commit
          # SHA so the correct commit is actually deployed.
          deploy_and_wait() {
            local label="$1"
            local service_id="$2"

            echo "🚀 Triggering deploy for $label ($service_id) at commit ${COMMIT_SHA}..."
            local deploy_response
            deploy_response=$(curl -s -X POST \
              "https://api.render.com/v1/services/${service_id}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"clearCache\": \"clear\", \"commitId\": \"${COMMIT_SHA}\"}")

            local deploy_id
            deploy_id=$(echo "$deploy_response" | jq -r '.id // empty')
            if [ -z "$deploy_id" ]; then
              echo "❌ Failed to trigger deployment for $label"
              echo "Response: $deploy_response"
              return 1
            fi
            echo "✅ Deployment triggered for $label: $deploy_id"

            local attempt=0
            local max_attempts=120
            while [ $attempt -lt $max_attempts ]; do
              local status_response status
              status_response=$(curl -s \
                "https://api.render.com/v1/services/${service_id}/deploys/${deploy_id}" \
                -H "Authorization: Bearer ${RENDER_API_KEY}")
              status=$(echo "$status_response" | jq -r '.status // empty')

              if [ "$status" = "live" ]; then
                echo "✅ $label deployment successful and live!"
                return 0
              elif [ "$status" = "build_failed" ] || [ "$status" = "deploy_failed" ]; then
                echo "❌ $label deployment failed with status: $status"
                return 1
              fi

              attempt=$((attempt + 1))
              sleep 5
            done

            echo "⏱️ $label deployment timeout (exceeded 10 minutes)"
            return 1
          }

          set +e
          deploy_and_wait "backend" "$RENDER_BACKEND_SERVICE_ID"
          backend_result=$?
          deploy_and_wait "frontend" "$RENDER_FRONTEND_SERVICE_ID"
          frontend_result=$?
          set -e

          if [ $backend_result -eq 0 ] && [ $frontend_result -eq 0 ]; then
            echo "deployment_status=success" >> $GITHUB_OUTPUT
            exit 0
          elif [ $backend_result -ne 0 ] && [ $frontend_result -ne 0 ]; then
            echo "deployment_status=failed (backend and frontend)" >> $GITHUB_OUTPUT
            exit 1
          elif [ $backend_result -ne 0 ]; then
            echo "deployment_status=failed (backend)" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "deployment_status=failed (frontend)" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Comment on PR - Success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🎮 Deployment to Test Environment - Success ✅

              **Test URL:** [${{ env.RENDER_TEST_URL }}](${{ env.RENDER_TEST_URL }})

              **PR Details:**
              - PR #${{ steps.pr_metadata.outputs.pr_number }}
              - Branch: \`${{ steps.pr_metadata.outputs.branch_name }}\`
              - Commit: \`${{ steps.pr_metadata.outputs.commit_sha }}\`

              The latest changes from this PR are now live on the test server. The commit and deploy time are shown in a badge in the game itself.

              Note: this is a **shared** test environment. It also redeploys automatically whenever another pull request is opened/updated, or whenever a commit is pushed to \`main\` — the environment always reflects whichever commit was pushed most recently, not necessarily this PR.

              ---
              *Automated deployment via GitHub Actions*`
            })

      - name: Comment on PR - Failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🎮 Deployment to Test Environment - Failed ❌

              **Status:** ${{ steps.render_deploy.outputs.deployment_status || 'unknown_error' }}

              **Troubleshooting:**
              1. Check that the \`RENDER_API_KEY\`, \`RENDER_BACKEND_SERVICE_ID\`, and \`RENDER_FRONTEND_SERVICE_ID\` secrets are correctly configured
              2. Verify both the \`goonbash-test\` backend (Web Service) and frontend (Static Site) exist and are properly configured in Render
              3. Check Render dashboard for detailed build/deployment logs
              4. For manual deployment: https://dashboard.render.com

              **PR Details:**
              - PR #${{ steps.pr_metadata.outputs.pr_number }}
              - Branch: \`${{ steps.pr_metadata.outputs.branch_name }}\`
              - Commit: \`${{ steps.pr_metadata.outputs.commit_sha }}\`

              ---
              *Automated deployment via GitHub Actions*`
            })

      - name: Set deployment status check
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.render_deploy.outputs.deployment_status }}' === 'success' ? 'success' : 'failure';
            const description = status === 'success' 
              ? 'Deployed to test environment' 
              : 'Failed to deploy to test environment';
            
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: status,
              description: description,
              context: 'Render Test Deployment',
              target_url: '${{ env.RENDER_TEST_URL }}'
            })
