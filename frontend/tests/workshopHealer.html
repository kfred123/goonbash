<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>GoonBash: Panzer und Werkzeug</title>
<style>
  body { margin: 24px; background: #151c28; color: #f3f0dc; font: 16px system-ui; }
  canvas { display: block; max-width: 100%; }
</style>
<h1>H1 Sanitaetspanzer / T2 Bastion / D1 Jaeger</h1>
<p id="result">Renderer-Integration wird geprueft ...</p>
<div id="preview"></div>
<script type="module">
  import Phaser from 'phaser';
  import { GameScene } from '../src/GameScene.ts';
  import { drawWrench } from '../src/wrenchVisuals.ts';
  import { getVehicleHeading } from '../src/roleTankVisuals.ts';

  const checks = [];
  function check(condition, message) {
    if (!condition) throw new Error(message);
    checks.push(message);
  }

  class RendererCheck extends GameScene {
    preload() {}
    update(time) {
      this.models?.forEach((model) => {
        model.turret.rotation = Math.sin(time / 1600) * 0.9;
        if (model.role === 'healer') {
          model.updateAbilityVisuals(false, 1000, 1000, 100, time);
        }
      });
    }

    create() {
      try {
        const now = Date.now();
        const tank = {
          x: 100, y: 100, team: 'blue', role: 'healer', name: 'Werkstatt',
          hp: 90, maxHp: 90, level: 1, state: 'alive',
          targetId: '',
          abilities: new Map([
            ['healer-aura', { activeUntil: now + 60000 }],
            ['healer-speed', { activeUntil: now + 60000 }]
          ])
        };
        this.room = { sessionId: 'local', state: {
          tanks: new Map([['local', tank]]), minions: new Map(), bases: new Map(), towers: new Map()
        } };
        this.arenaStarted = true;
        this.upsertTank(tank, 'local');
        const sprite = this.tankSprites.get('local');
        const { effects, chassis, turret } = sprite;
        check(sprite instanceof Phaser.GameObjects.Container, 'Healer verwendet einen Container');
        check(sprite.x === 100 && sprite.y === 100 && sprite.width === 40, 'Weltposition und Groesse erhalten');
        check(sprite.list.length === 3 && sprite.list.every(child => child instanceof Phaser.GameObjects.Graphics), 'Eigener Spieler hat keine Kreisobjekte');
        check(this.tankNameTexts.get('local').text.includes('(You)'), 'Eigener Spieler bleibt am Namen erkennbar');
        check(this.cameras.main._follow === sprite, 'Kamera folgt der Container-Wurzel');
        this.upsertTank({ ...tank, x: 140 }, 'local');
        GameScene.prototype.update.call(this);
        check(sprite.x === 110 && sprite.y === 100, 'Positionsinterpolation bewegt die Figur');
        check(this.tankNameTexts.get('local').x === sprite.x, 'Name folgt der Wurzelposition');
        check(this.healthBars.get('local').bg.x === sprite.x, 'Lebensbalken folgt der Wurzelposition');
        check(this.healthBars.get('local').bg.getBounds().bottom < this.tankNameTexts.get('local').getBounds().top, 'Lebensbalken und Name ueberlappen nicht');
        check(effects.commandBuffer.length > 0, 'Gleichzeitige Effekte werden gezeichnet');
        check(this.healEffectIcons.has('local'), 'Bisheriger Heilungs-Schraubenschluessel bleibt erhalten');
        const effect = this.healEffectIcons.get('local');
        const expectedWrench = this.add.graphics();
        drawWrench(expectedWrench, 0, 0, 22);
        check(JSON.stringify(effect.commandBuffer) === JSON.stringify(expectedWrench.commandBuffer), 'Heilung verwendet dieselbe Werkzeuggeometrie');
        expectedWrench.destroy();
        const hudExpected = this.add.graphics().clear();
        const hudActual = this.add.graphics();
        drawWrench(hudExpected, 0, 0, 22);
        this.drawAbilityIcon(hudActual, 'healer-aura', 0, 0, 22);
        check(JSON.stringify(hudActual.commandBuffer) === JSON.stringify(hudExpected.commandBuffer), 'HUD verwendet dieselbe Werkzeuggeometrie');
        hudExpected.destroy();
        hudActual.destroy();

        const enemy = { ...tank, x: 250, y: 100, team: 'red', role: 'damagedealer', abilities: new Map() };
        this.room.state.tanks.set('enemy', enemy);
        this.upsertTank(enemy, 'enemy');
        tank.targetId = 'enemy';
        this.tankTargets.set('local', { x: sprite.x, y: sprite.y + 40 });
        this.tankTargets.set('enemy', { x: 290, y: 100 });
        GameScene.prototype.update.call(this);
        const enemySprite = this.tankSprites.get('enemy');
        check(Math.abs(Math.abs(chassis.rotation) - Math.PI) < 0.001, 'Wanne folgt Bewegung nach unten');
        check(Math.abs(turret.rotation - getVehicleHeading(sprite, enemySprite, 0)) < 0.001, 'Turm zielt unabhaengig auf interpolierten Gegner');
        const heading = turret.rotation;
        tank.targetId = '';
        GameScene.prototype.update.call(this);
        check(turret.rotation === heading, 'Turm behaelt ohne Ziel seine letzte Richtung');
        tank.targetId = 'enemy';
        enemy.state = 'dead';
        GameScene.prototype.update.call(this);
        check(turret.rotation === heading, 'Totes Ziel dreht Turm nicht weiter');
        tank.targetId = '';
        this.removeTank('enemy');
        this.room.state.tanks.delete('enemy');

        tank.state = 'dead';
        this.upsertTank(tank, 'local');
        this.applyRoleAbilityVisuals();
        check(!sprite.visible && effects.commandBuffer.length === 0, 'Tod blendet Figur und Effekte aus');
        check(!this.healEffectIcons.has('local'), 'Tod entfernt Heilungssymbol');
        tank.state = 'alive';
        this.upsertTank(tank, 'local');
        this.applyRoleAbilityVisuals();
        check(sprite.visible && this.tankSprites.get('local') === sprite, 'Respawn verwendet dieselbe vollstaendige Figur');
        tank.abilities.get('healer-aura').activeUntil = 0;
        tank.abilities.get('healer-speed').activeUntil = 0;
        this.applyRoleAbilityVisuals();
        check(effects.commandBuffer.length === 0, 'Abgelaufene Effekte werden geloescht');

        const preview = this.createRoleShape(240, 100, 'healer', 32, 0xff4444).setScale(1.5);
        check(preview.chassis.scaleX === 32 / 68 && preview.scaleX === 1.5, 'Lobbydetailgroesse und Viewportskalierung getrennt');
        check(preview.effects.commandBuffer.length === 0, 'Lobbyvorschau hat keine aktiven Effekte');
        preview.destroy();
        for (const [width, height] of [[1000, 810], [640, 480]]) {
          this.scale.resize(width, height);
          for (const [index, role] of ['healer', 'tank', 'damagedealer'].entries()) {
            const model = this.createRoleShape(0, 0, role, 40, 0x4d8dff);
            check(model instanceof Phaser.GameObjects.Container && model.chassis !== model.turret, `${role}: Wanne und Turm getrennt (${width}px)`);
            check(model.list.length === 3 && model.list.every(child => child instanceof Phaser.GameObjects.Graphics), `${role}: keine umlaufenden Kreisobjekte (${width}px)`);
            model.destroy();
            this.addRoleCard(250 + index * 150, 467, role, index === 1, 0xff4444, () => {});
            const [card, lobbyModel, label] = this.menuElements;
            const bounds = card.getBounds();
            const textBounds = label.getBounds();
            const scale = lobbyModel.scaleX * 32 / 68;
            check(lobbyModel.width === 32 && lobbyModel.turret.commandBuffer.length > 0, `${role}: Lobbygrafik 60 Prozent groesser (${width}px)`);
            check(lobbyModel.y - 50 * scale > bounds.top && lobbyModel.y + 41 * scale < textBounds.top, `${role}: Grafik passt oberhalb der Beschriftung (${width}px)`);
            check(textBounds.bottom < bounds.bottom && textBounds.left > bounds.left && textBounds.right < bounds.right, `${role}: Beschriftung passt in Karte (${width}px)`);
            check(bounds.top >= this.viewportY(425) - 0.01 && bounds.bottom < this.viewportY(515), `${role}: Karte passt zwischen Ueberschrift und Startknopf (${width}px)`);
            this.destroyMenuElements();
          }
        }
        this.scale.resize(1000, 810);
        this.removeTank('local');
        check([sprite, chassis, turret, effects].every(child => !child.scene), 'Spielerentfernung zerstoert alle Kindobjekte');
        check(!this.tankTargets.has('local') && !this.healthBars.has('local') && !this.tankNameTexts.has('local'), 'Spielerentfernung raeumt Folgeanzeigen auf');
        check(this.cameras.main._follow === null, 'Spielerentfernung beendet Kamerafolge');

        tank.role = 'tank';
        tank.abilities = new Map([['tank-shield', { activeUntil: now + 60000 }]]);
        this.upsertTank(tank, 'local');
        const respawned = this.tankSprites.get('local');
        this.applyRoleAbilityVisuals();
        check(respawned.list.length === 3 && respawned.list.every(child => child instanceof Phaser.GameObjects.Graphics), 'Shield erzeugt keinen Schutz- oder Auswahlkreis');
        tank.abilities = new Map([['tank-entrench', { activeUntil: now + 60000 }]]);
        this.applyRoleAbilityVisuals();
        check(respawned.list.length === 3 && respawned.list.every(child => child instanceof Phaser.GameObjects.Graphics), 'Entrench erzeugt keinen Schutzkreis');
        tank.abilities.clear();
        this.applyRoleAbilityVisuals();
        check(respawned.list.length === 3, 'Abgelaufene Verteidigung hinterlaesst keine Kreisobjekte');
        const children = [...respawned.list];
        this.clearArenaPresentation();
        check(!respawned.scene && children.every((child) => !child.scene), 'Arena-Aufraeumen zerstoert gesamten Panzer');
        check(this.tankSprites.size === 0 && this.healEffectIcons.size === 0, 'Arena-Aufraeumen leert die Maps');
        this.resetCamera();
        this.arenaStarted = false;
        this.drawPreview();
        window.healerCheckResult = { ok: true, checks };
        document.getElementById('result').textContent = `${checks.length} Renderer-Pruefungen erfolgreich. Links vergroessert, rechts in Spiel- und Lobbygroesse. Tuerme drehen unabhaengig von der Wanne.`;
      } catch (error) {
        window.healerCheckResult = { ok: false, error: error.stack, checks };
        document.getElementById('result').textContent = error.message;
        console.error(error);
      }
    }

    drawPreview() {
      const roles = [
        ['healer', 'H1 / Sanitaetspanzer'],
        ['tank', 'T2 / Bastion'],
        ['damagedealer', 'D1 / Jaeger']
      ];
      this.models = [];
      roles.forEach(([role, label], index) => {
        const y = 115 + index * 180;
        this.add.rectangle(500, y, 980, 170, index % 2 ? 0x627649 : 0x9b947f);
        this.add.text(24, y - 74, label, { color: '#ffffff', fontSize: '18px' });
        [0x4d8dff, 0xff4444].forEach((color, teamIndex) => {
          const x = 210 + teamIndex * 280;
          const model = this.createRoleShape(x, y + 10, role, 40, color).setScale(2.5);
          model.role = role;
          this.models.push(model);
          const world = this.createRoleShape(720 + teamIndex * 100, y - 15, role, 40, color);
          world.role = role;
          this.models.push(world);
          this.createRoleShape(720 + teamIndex * 100, y + 45, role, 32, color);
        });
      });
      this.add.rectangle(500, 702, 980, 180, 0x1c2a3c);
      this.add.text(24, 622, 'Ein Werkzeug, ueberall dieselbe Form', { fontSize: '20px', color: '#f3f0dc' });
      const largeWrench = this.add.graphics();
      drawWrench(largeWrench, 165, 720, 115);
      this.add.text(300, 677, 'Offenes Maul / Metallschaft / Ringende', { fontSize: '17px', color: '#bacbda' });
      for (const [x, size] of [[340, 22], [470, 30], [600, 12]]) {
        const g = this.add.graphics();
        drawWrench(g, x, 735, size, size > 12);
        this.add.text(x, 767, `${size} px`, { fontSize: '12px', color: '#bacbda' }).setOrigin(.5);
      }
      this.add.text(700, 710, '22 px: Heilung\n30 px: HUD\n12 px: Turm', { fontSize: '16px', color: '#bacbda', lineSpacing: 8 });
      window.rolePreviewScene = this;
    }
  }

  new Phaser.Game({
    type: Phaser.CANVAS, width: 1000, height: 810, parent: 'preview',
    backgroundColor: '#151c28', audio: { noAudio: true }, scene: [RendererCheck]
  });
</script>
</html>
